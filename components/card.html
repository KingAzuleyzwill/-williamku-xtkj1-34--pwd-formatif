<!DOCTYPE html>

<!-- Jika box sizing tidak diatur:
 320px + 40px padding + 4 border = 364px -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    

    <style>

        * {
            box-sizing: border-box;
            
        }

        body {
            margin: 0 ;
            background-color: #FFFFFF;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid ;
            margin: 30px auto ;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }

        .card h3 {
            color: rgba(0, 0, 138, 1);
            margin-bottom: 8px ;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: red;
        }

        footer {
            text-align: center;
        }


    </style>




</head>
<body>
    
<main>
    <div class="card">
        <img src="../assets/images/dana masuk boskuh.jpg" alt="gambar">

        <h3>Website Toko Online</h3>

        <p>
            Proyek latihan untuk membuat halaman toko yang sederhana. Dibuat dengan HTML dan CSS untuk memperindah website.
        </p>

        <a href="#">Lihat Proyek </a>

    </div>
</main>

<footer>
    <a href="../index.html">Kembali ke Beranda</a>
</footer>



</body>
</html>
