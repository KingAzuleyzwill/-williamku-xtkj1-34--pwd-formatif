<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>


    <style>

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid;
        }

        .contact-form h2 {
            text-align: center;
            color: navy;
        }
        
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 10px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            background-color: lightyellow;
            border: 1px solid blue;
            outline: none;
        }

        .btn-submit {
            background-color: navy;
            color: white;
            border-radius: 10px;
            padding: 10px ;
        }

        .btn-submit:hover {
            background-color: grey;
        }

        footer{
            text-align: center;
            padding: 10px;
        }




    </style>


</head>
<body>
    
<section id="contact">

    <form action="" class="contact-form">

        <h2>
            Hubungi Saya
        </h2>

        <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" id="nama">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea  id="pesan"></textarea>
        </div>

        <button type="submit" class="btn-submit">
            Kirim Pesan
        </button>

    </form>


    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</section>




</body>
</html>
